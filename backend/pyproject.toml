[project]
name = "assessment-platform"
version = "0.1.0"
description = "Mock online assessment platform with randomised questions and a sandboxed code judge"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "pwdlib[argon2]>=0.2",
  "pillow>=10.4",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "docker: requires Docker daemon",
  "postgres: requires PostgreSQL",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]  # autogenerated
"app/sandbox/runner.py" = ["E501"]  # embedded shell script (RUN_SH) is kept on single lines
