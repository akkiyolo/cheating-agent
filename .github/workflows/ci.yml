name: CI

on:
  push:
    branches: [main, platform-backend]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assess
          POSTGRES_PASSWORD: assess
          POSTGRES_DB: assessment
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U assess" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy app
      - name: Migrations apply cleanly and match the models
        run: uv run alembic upgrade head && uv run alembic check && uv run alembic downgrade base
      - name: Pre-pull sandbox images
        run: docker pull -q python:3.13-slim && docker pull -q gcc:14 && docker pull -q eclipse-temurin:21-jdk
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Tests (PostgreSQL)
        run: uv run pytest -q
        env:
          DATABASE_URL: postgresql+asyncpg://assess:assess@localhost:5433/assessment

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-assessment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mock-assessment/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
        env:
          JWT_SECRET: ci-only-secret
