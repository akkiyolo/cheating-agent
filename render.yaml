# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Creates a Postgres database and one Docker web service (front end + API) built from ./Dockerfile.
databases:
  - name: assessment-db
    databaseName: assessment
    user: assess
    plan: free

services:
  - type: web
    name: assessment-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: assessment-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Seed account passwords are generated; read them in the service's Environment tab.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: RESEARCHER_PASSWORD
        generateValue: true
      - key: CANDIDATE_PASSWORD
        generateValue: true
